[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-ocr"
version = "1.0.0"
description = "100% Air-Gapped Sovereign OCR & Neuro-Symbolic Document Intelligence Engine (Rust parsers + Geometry/DPI Visual Preprocessing + Pydantic-to-GLiNER2.5 + Active Ontology + Cryptographic Quad Provenance)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "pydantic>=2.5.0",
]

[project.scripts]
sovereign-ocr = "sovereign_ocr.cli:main"
sovereign-ocr-mcp = "sovereign_ocr.cli:main_mcp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
